name: Web Console Integration Tests (ubuntu 26.04 test)
'on':
  workflow_call:
    inputs:
      image_tag:
        description: Image tag to test. Empty means this ref's own sha- tag.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag of an already-built image to test, e.g. sha-<40-char-sha> from an earlier run. Leave empty to use this ref's own sha- tag, which only exists if the image was built for exactly this
          commit.
        required: false
        type: string
jobs:
  web-console-e2e-auth:
    name: Web Console E2E Tests (OIDC login)
    runs-on: ubuntu-26-amd64
    timeout-minutes: 20
    env:
      FELDERA_IMAGE: ${{ vars.FELDERA_IMAGE_NAME }}:${{ inputs.image_tag || format('sha-{0}', github.sha) }}
      OIDC_ISSUER: http://localhost:9876
    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
    - name: Login to GHCR with GITHUB_TOKEN
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: Start the dummy OIDC provider
      run: |
        nohup uv run scripts/dummy_oidc.py --port 9876 --issuer "$OIDC_ISSUER" > dummy-oidc.log 2>&1 &
        echo "DUMMY_OIDC_PID=$!" >> "$GITHUB_ENV"
        curl -fsS --retry 60 --retry-delay 1 --retry-connrefused "$OIDC_ISSUER/.well-known/openid-configuration" > /dev/null
    - name: Start pipeline-manager with OIDC authentication
      run: |
        docker run -d \
          --pull missing \
          --name pipeline-manager-auth \
          --network host \
          -e AUTH_PROVIDER=generic-oidc \
          -e FELDERA_AUTH_CLIENT_ID=feldera \
          -e FELDERA_AUTH_ISSUER="$OIDC_ISSUER" \
          -e FELDERA_AUTH_AUDIENCE=feldera-api \
          -e RUST_LOG=info \
          -e RUST_BACKTRACE=1 \
          "$FELDERA_IMAGE"
        curl -fsS --retry 60 --retry-delay 2 --retry-connrefused http://localhost:8080/healthz
    - name: Run Playwright e2e tests with OIDC login
      if: ${{ vars.CI_DRY_RUN != 'true' }}
      run: |
        docker run --rm \
          --network host \
          --ipc host \
          --user "$(id -u):$(id -g)" \
          -e HOME=/tmp/home \
          -e CI \
          -e PLAYWRIGHT_API_ORIGIN=http://localhost:8080 \
          -e PLAYWRIGHT_APP_ORIGIN=http://localhost:8080 \
          -v "$GITHUB_WORKSPACE:/work" \
          -w /work \
          mcr.microsoft.com/playwright:v1.58.2-noble \
          bash -euo pipefail -c '
            npm install -g --prefix /tmp/bun bun@1.3.10
            export PATH="/tmp/bun/bin:$PATH"
            bun install --frozen-lockfile
            cd js-packages/web-console
            bunx svelte-kit sync
            bun run test-e2e-auth
          '
    - name: Upload Playwright traces
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: web-console-e2e-auth-traces
        path: js-packages/web-console/test-results
        if-no-files-found: ignore
    - name: Logs & Cleanup
      if: always()
      run: |
        docker logs pipeline-manager-auth || true
        docker rm -f pipeline-manager-auth || true
        cat dummy-oidc.log || true
        if [ -n "${DUMMY_OIDC_PID:-}" ]; then kill "$DUMMY_OIDC_PID" || true; fi
